server {
    listen 443 ssl;
    server_name de.7apri.cfd;

    ssl_certificate /etc/letsencrypt/live/de.7apri.cfd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/de.7apri.cfd/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://server:8080;
    }

    location = /ws-reload {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://server:8080;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /favicon.ico {
        root /var/www/static/assets;
        try_files /favicon.svg =404;
        access_log off;
    }

    error_page 404 /error_404;
    location = /error_404 {
        internal;
        return 404 "Not Found";
    }

    error_page 429 /error_429;
    location = /error_429 {
        internal;
        default_type application/json;
        return 429 "{\"code\":\"err:too_many_requests\"}";
    }

    location / {
        proxy_pass http://server:8080;
    }
}
