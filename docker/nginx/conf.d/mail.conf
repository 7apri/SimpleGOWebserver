server {
    listen 443 ssl;
    server_name mail.7apri.cfd;

    ssl_certificate /etc/letsencrypt/live/de.7apri.cfd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/de.7apri.cfd/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://mailpit:8025;

        proxy_set_header Host mail.7apri.cfd;
        
	    proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

	    proxy_buffering off;
    }
}
