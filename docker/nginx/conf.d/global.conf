#    ""      $remote_addr;
#    default $http_cf_connecting_ip;
#}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

map $request_uri $loggable {
    ~*\.(css|js|png|jpg|gif|ico|svg|webp)$ 0;
    default 1;
}

log_format custom_json escape=json '{'
    '"time": "$time_iso8601",'
    '"ip": "$remote_addr",'
    '"status": "$status",'
    '"rt": "$request_time",'
    '"urt": "$upstream_response_time",'
    '"req": "$request",'
    '"ua": "$http_user_agent"'
'}';

access_log /var/log/nginx/access.log custom_json buffer=32k flush=5s if=$loggable;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

brotli_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

server {
    listen 80;
    
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}