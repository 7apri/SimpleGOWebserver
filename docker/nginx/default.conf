map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $http_cf_connecting_ip zone=auth_limit:10m rate=1r/s;

map $request_uri $loggable {
    ~*\.(css|js|png|jpg|gif|ico|svg|webp)$ 0;
    default 1;
}

log_format custom_json escape=json '{'
    '"time": "$time_iso8601",'
    '"ip": "$http_cf_connecting_ip",'
    '"status": "$status",'
    '"rt": "$request_time",'
    '"urt": "$upstream_response_time",'
    '"req": "$request",'
    '"ua": "$http_user_agent"'
'}';

access_log /var/log/nginx/access.log custom_json buffer=32k flush=5s if=$loggable;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

brotli_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

server {
    listen 80;
    server_name localhost;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://server:8080;
    }

    location = /ws-reload {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://server:8080;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /favicon.ico {
        root /var/www/static/assets;
        try_files /favicon.svg =404;
        access_log off;
    }

    error_page 404 /error_404;
    location = /error_404 {
        internal;
        return 404 "Not Found";
    }

    error_page 429 /error_429;
    location = /error_429 {
        internal;
        default_type application/json;
        return 429 "{\"code\":\"err:too_many_requests\"}";
    }

    location / {
        proxy_pass http://server:8080;
    }
}