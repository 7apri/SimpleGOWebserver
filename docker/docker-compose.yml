services:
  server:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.server
    depends_on:
      - database
      - redis
    volumes:
      - dbsocket:/var/run/postgresql
      - ../site/i18n:/app/i18n
      - ../site/templates:/app/templates
      - ../site/static:/app/static
    env_file: .env
    environment:
      - REDIS_ADDRESS=redis:6379
  database:
    build:
      context: .
      dockerfile: ./Dockerfile.database
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - dbsocket:${DB_SOCKET_PATH}
    command: ["postgres", "-c", "unix_socket_permissions=0777"]
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes 
  nginx:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./nginx/configs/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs/:/var/log/nginx/
      - ../site/static:/var/www/static:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
  mailpit:
    image: axllent/mailpit:latest
volumes:
  pgdata:
  redis_data:
  dbsocket:
