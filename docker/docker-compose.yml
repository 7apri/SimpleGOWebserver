services:
  server:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.server
    depends_on:
      - database
      - redis
    volumes:
      - dbsocket:/var/run/postgresql
      - ../cmd/server/site/i18n:/app/i18n
      - ../cmd/server/site/templates:/app/templates
    env_file: .env
    environment:
      - REDIS_ADDRESS=redis:6379
  database:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.database
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - dbsocket:${DB_SOCKET_PATH}
    command: ["postgres", "-c", "unix_socket_permissions=0777"]
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes 
  cloudflare:
    env_file: .env
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - server
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../cmd/server/site/static:/var/www/static:ro
    depends_on:
      - server
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
volumes:
  pgdata:
  redis_data:
  dbsocket: