services:
  server:
    build:
      context: ..
      dockerfile: ./docker/server.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
    volumes:
      - dbsocket:/var/run/postgresql
      - ../site/i18n:/app/i18n
      - ../site/templates:/app/templates
      - ../site/static:/app/static
    env_file: .env
    environment:
      - REDIS_ADDRESS=redis:6379
  database:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: ./docker/database.Dockerfile
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - dbsocket:${DB_SOCKET_PATH}
    command: ["postgres", "-c", "unix_socket_permissions=0777"]
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
  nginx:
    build:
      context: ..
      dockerfile: ./docker/nginx.Dockerfile
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx/
      - ../site/static:/var/www/static:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_BASEPATH: "/mail"
volumes:
  pgdata:
  redis_data:
  dbsocket:
