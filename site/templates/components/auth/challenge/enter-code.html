<h1 class="txt-2xl mb-sm ls-wide">[[ tr .Data.TitleKey ]]</h1>
<form class="flx col gap-sm ali-s j-left txt-left mb-sm" id="[[ .Data.FormID ]]">
     [[ import "components/auth/code-input.html" ( dict
        "Classes"   "txt-xl h-var fw-bold"
        "Attribute" "autofocus"
        "Styles"    "--h:2.5em"
    )]]
    <div class="flx fil-x gap-md">
        <button 
            class="txt-lg fw-bold py-sm bg-primary"
            type="submit"
            data-endpoint="[[ .Data.Endpoint ]]" 
            style="--load-color: var(--on-primary); flex: 1;"
        >[[ capitalize (tr "phrase:next") ]]</button>
        <button 
            class="txt-lg fw-bold p-sm  bg-primary"
            type="button"
            data-endpoint="[[ .Data.ResendEndpoint  ]]" 
            style="--load-color: var(--on-primary);"
            id="resend-btn"
           >[[ capitalize (tr "btn:resend") ]]</button>
    </div>
</form>
