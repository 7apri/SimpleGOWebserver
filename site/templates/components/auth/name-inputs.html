[[ registerScript "auth/components/name-inputs.js" ]]
<div class="mb-md fil-x">
    <div class="flx j-spcBetween">
        <label class="fil-x" for="display-name-input">[[ capitalize (tr "phrase:display_name") ]]</label>
        <span id="display-name-lenght"></span>
    </div>
    <input
        class="fil-x p-sm mb-md mt-sm txt-lg" 
        name="display_name"
        id="display-name-input"
        type="text"
        maxlength="26"
        autocomplete="name"
        placeholder="[[ tr "plh:display_name" ]]"
        required
    />
    <div class="fil-x flx j-spcBetween">
        <label for="username-input">[[ capitalize (tr "phrase:username") ]]</label>
        <span id="username-hint"></span>
    </div>
    <div class="pos-rel mt-sm fil-x">
        <input  
            class="fil-x p-sm txt-lg pr-2xl"
            name="username"
            id="username-input"
            maxlength="18"
            type="text"
            placeholder="[[ tr "plh:user" ]]"
            required
        />
        <div class="pos-abs top right fil-y grd pli-c" id="username-status" style="width: 2.5em;">
            <svg class="icon color">
                <use href="[[ asset "/static/assets/iconBundle.svg" ]]"></use>
            </svg>
        </div>
    </div>
    <div class="flx col gap-sm j-center hidden" id="username-suggestions">
        <span>[[ capitalize (tr "phrase:username_try" ) ]]</span>
        <ul class="gap-sm flx wrap">
            [[- range seq 3 ]]
            <li>
                <button class="px-sm py-xs" type="button"></button>
            </li>
            [[ end -]]
        </ul>
    </div>
</div>
