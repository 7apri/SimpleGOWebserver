---
kind : htmx
name : follow-button
---
<button 
class="user-profile-follow-btn"
{{ if not .IsFollowed }}
not-following
{{ end }}
hx-post="/{{ .Username }}/follow" 
hx-target="this" 
hx-swap="outerHTML">
        {{ if .IsFollowed }}[[ tr "phrase:unfollow" ]]{{ else }}[[ tr "phrase:follow" ]]{{ end }}
</button>
<span id="user-profile-count-followers" hx-swap-oob="true">{{ .FollowerCount }}</span>
