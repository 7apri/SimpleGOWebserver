---
kind   : htmx
layout : htmx
name : home
---
<header>
    <nav>
        <ul class="flx j-spcBetween">
            <li class="posts-tab lighten" aria-selected="true">
                 <span>[[ capitalize (tr "phrase:global") ]]</span>
            </li>
            <li class="posts-tab lighten" > 
                <span>[[ capitalize (tr "phrase:following") ]]</span>
            </li>
        </ul>
    </nav>
</header>
<section class="my-md bg-surface-container bdr-rad-md p-md flx gap-sm" style="--pfp-size:3rem">
    <img class="pfp" src="{{ .AvatarURL }}" >
    <div class="fil-x">
        <div
        class="post-input"
        aria-placeholder="[[ capitalize (tr "plh:posts:post" ) ]]"
        contenteditable="true" 
        role="textbox"
        ></div>
        <div class="flx j-spcBetween">
            <div>

            </div>
            <button class="px-md py-sm reverse-colors deform">
                [[ capitalize (tr "phrase:post") ]]
            </button>
        </div>
    </div>
</section>
