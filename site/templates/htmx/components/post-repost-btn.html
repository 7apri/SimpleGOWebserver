---
kind : htmx
name : post-repost-btn
---
<button hx-post="/posts/{{ .PostID }}/repost"  
        hx-swap="outerHTML"
        class="post-repost-btn"
        aria-checked=".IsChecked"
        aria-label="{{ if .IsChecked }}[[capitalize (tr "phrase:unrepost")]]{{ else }}[[capitalize (tr "phrase:repost")]]{{ end }}">
        {{ .Count }}
</button>
