---
name   : test
layout : test
kind   : email
---

<!DOCTYPE html>
<html lang="[[ .Lang.Code ]]" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{ block "email_subject" . }}[[ tr "phrase:something_went_wrong" ]]{{ end }}</title>
    <style>
        :root { color-scheme: light dark; supported-color-schemes: light dark; }
        
        #outlook a { padding: 0; }
        .ExternalClass { width: 100%; }
        .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
        
        body { margin: 0; padding: 0; width: 100% !important; font-family: "Inter", Helvetica, Arial, sans-serif; }
        body, .wrapper { background-color: #02060D !important; color: #E6ECF2 !important; }
        .container     { background-color: #26232e !important; }
        .btn-primary   { background-color: #80c3ff !important; color: #141540 !important; }
        
        @media (prefers-color-scheme: light) {
            body, .wrapper { background-color:#F4F9FF !important; color: #050C13 !important; }
            .container     { background-color:#e2edf8 !important; }
            .btn-primary   { background-color:#0041ac !important; color: #f4f9ff !important; }
        }

        [data-ogsc] body, [data-ogsc] .wrapper { background-color: #02060D !important; }
        [data-ogsc] .text-main { color: #EEEEEE !important; }
    </style>
</head>
<body class="wrapper">
    <div role="article" aria-roledescription="email" lang="[[ .Lang.Code ]]" style="text-size-adjust: 100%; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
        <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
            <tr>
                <td align="center" class="wrapper" style="padding: 40px 10px;">
                    <table class="container" width="600" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width: 100%; max-width: 600px; border-radius: 8px;">
                        <tr>
                            <td style="padding: 40px;" align="center">
                                <h1 class="text-main" style="margin: 0 0 20px 0; font-size: 24px; font-weight: bold;">
                                    [[ tr "title:verify/email" ]]
                                </h1>
                                <p class="text-main" style="margin: 0 0 30px 0; font-size: 16px; line-height: 24px;">
                                    [[ tr "desc:verify/email"  ]]
                                </p>
                                <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin-bottom:  25px;">
                                    <tr>
                                        <td align="center" style="font-size: 48px; letter-spacing: 5px;">
                                            <span>123</span><span style="margin-left: 10px;">456</span>
                                        </td>
                                    </tr>
                                </table>
                                <table border="0" cellpadding="0" cellspacing="0" role="presentation">
                                    <tr>
                                        <td align="center" class="btn-primary" style="padding: 15px 48px; border-radius: 4px;">
                                            <a href="{{ .ActionLink }}" class="btn-primary" style="font-weight: bold;">
                                                [[ tr "phrase:verify" ]]
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                    <table width="600" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width: 100%; max-width: 600px; font-size: 12px; color: #888888; padding: 20px;">
                        <tr>
                            <td align="center">
                                &copy; 2026 Panels. [[ tr "footer:email" ]]
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                [[ tr "footer:email/sent" ]] {{ .Email }}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
